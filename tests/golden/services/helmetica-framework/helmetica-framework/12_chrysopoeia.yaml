    control-plane: controller-manager
  name: chrysopoeia-controller-manager-metrics-service
  namespace: syn-helmetica-framework
spec:
  ports:
    - name: https
      port: 8443
      protocol: TCP
      targetPort: 8443
  selector:
    app.kubernetes.io/name: chrysopoeia
    control-plane: controller-manager
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: chrysopoeia
  name: chrysopoeia-webhook-service
  namespace: syn-helmetica-framework
spec:
  ports:
    - port: 443
      protocol: TCP
      targetPort: 9443
  selector:
    app.kubernetes.io/name: chrysopoeia
    control-plane: controller-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: manager
    app.kubernetes.io/created-by: chrysopoeia
    app.kubernetes.io/instance: controller-manager
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: deployment
    app.kubernetes.io/part-of: chrysopoeia
    control-plane: controller-manager
  name: chrysopoeia-controller-manager
  namespace: syn-helmetica-framework
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: chrysopoeia
        control-plane: controller-manager
    spec:
      containers:
        - args:
            - controller
            - --metrics-bind-address=:8443
            - --leader-elect
            - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
            - --metrics-cert-path=/tmp/k8s-metrics-server/metrics-certs
            - --image-reflector-controller-hostname=image-reflector-controller-tags.syn-helmetica-framework.svc:8090
            - --harness-proxy-host=chrysopoeia-proxy.syn-helmetica-framework.svc
            - --harness-proxy-ca-secret-namespace=syn-helmetica-framework
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          image: ghcr.io/helmetica-framework/chrysopoeia:v0.1.7
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          name: manager
          ports:
            - containerPort: 9443
              name: webhook-server
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /tmp/k8s-webhook-server/serving-certs
              name: webhook-certs
              readOnly: true
            - mountPath: /tmp/k8s-metrics-server/metrics-certs
              name: metrics-certs
              readOnly: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: chrysopoeia-controller-manager
      terminationGracePeriodSeconds: 10
      volumes:
        - name: webhook-certs
          secret:
            secretName: chrysopoeia-webhook-server-cert
        - name: metrics-certs
          secret:
            items:
              - key: ca.crt
                path: ca.crt
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
            optional: false
            secretName: chrysopoeia-metrics-server-cert
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: chrysopoeia
  name: chrysopoeia-metrics-certs
  namespace: syn-helmetica-framework
spec:
  dnsNames:
    - chrysopoeia-controller-manager-metrics-service.syn-helmetica-framework.svc
    - chrysopoeia-controller-manager-metrics-service.syn-helmetica-framework.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: chrysopoeia-selfsigned-issuer
  secretName: chrysopoeia-metrics-server-cert
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: chrysopoeia
  name: chrysopoeia-serving-cert
  namespace: syn-helmetica-framework
spec:
  dnsNames:
    - chrysopoeia-webhook-service.syn-helmetica-framework.svc
    - chrysopoeia-webhook-service.syn-helmetica-framework.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: chrysopoeia-selfsigned-issuer
  secretName: chrysopoeia-webhook-server-cert
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: chrysopoeia
  name: chrysopoeia-selfsigned-issuer
  namespace: syn-helmetica-framework
spec:
  selfSigned: {}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/component: metrics
    app.kubernetes.io/created-by: chrysopoeia
    app.kubernetes.io/instance: controller-manager-metrics-monitor
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: servicemonitor
    app.kubernetes.io/part-of: chrysopoeia
    control-plane: controller-manager
  name: chrysopoeia-controller-manager-metrics-monitor
  namespace: syn-helmetica-framework
spec:
  endpoints:
    - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      path: /metrics
      port: https
      scheme: https
      tlsConfig:
        ca:
          secret:
            key: ca.crt
            name: chrysopoeia-metrics-server-cert
        cert:
          secret:
            key: tls.crt
            name: chrysopoeia-metrics-server-cert
        insecureSkipVerify: false
        keySecret:
          key: tls.key
          name: chrysopoeia-metrics-server-cert
        serverName: chrysopoeia-controller-manager-metrics-service.syn-helmetica-framework.svc
  selector:
    matchLabels:
      control-plane: controller-manager
---
