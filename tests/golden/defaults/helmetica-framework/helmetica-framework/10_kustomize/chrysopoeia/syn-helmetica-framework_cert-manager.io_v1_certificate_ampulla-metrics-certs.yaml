apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: ampulla
  name: ampulla-metrics-certs
  namespace: syn-helmetica-framework
spec:
  dnsNames:
  - ampulla-controller-manager-metrics-service.syn-helmetica-framework.svc
  - ampulla-controller-manager-metrics-service.syn-helmetica-framework.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: ampulla-selfsigned-issuer
  secretName: metrics-server-cert
