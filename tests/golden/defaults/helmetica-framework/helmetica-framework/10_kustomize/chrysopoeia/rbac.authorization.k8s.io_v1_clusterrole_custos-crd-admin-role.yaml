apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
  name: custos-crd-admin-role
rules:
- apiGroups:
  - custos.helmetica.io
  resources:
  - credentialconfigs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - custos.helmetica.io
  resources:
  - credentialconfigs/status
  verbs:
  - get
