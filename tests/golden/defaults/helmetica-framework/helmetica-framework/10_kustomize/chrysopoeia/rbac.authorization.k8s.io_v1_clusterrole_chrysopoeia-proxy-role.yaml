apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chrysopoeia-proxy-role
rules:
- apiGroups:
  - '*'
  resources:
  - '*'
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - ""
  - authentication.k8s.io
  resources:
  - '*'
  verbs:
  - impersonate
