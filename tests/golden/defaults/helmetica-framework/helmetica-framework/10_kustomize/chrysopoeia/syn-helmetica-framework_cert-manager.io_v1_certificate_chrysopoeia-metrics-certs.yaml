apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: chrysopoeia
  name: chrysopoeia-metrics-certs
  namespace: syn-helmetica-framework
spec:
  dnsNames:
  - chrysopoeia-controller-manager-metrics-service.syn-helmetica-framework.svc
  - chrysopoeia-controller-manager-metrics-service.syn-helmetica-framework.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: chrysopoeia-selfsigned-issuer
  secretName: metrics-server-cert
