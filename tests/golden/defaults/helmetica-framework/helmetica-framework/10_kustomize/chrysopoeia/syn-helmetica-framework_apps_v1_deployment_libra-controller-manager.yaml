apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: manager
    app.kubernetes.io/created-by: libra
    app.kubernetes.io/instance: controller-manager
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: deployment
    app.kubernetes.io/part-of: libra
    control-plane: controller-manager
  name: libra-controller-manager
  namespace: syn-helmetica-framework
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: libra
        control-plane: controller-manager
    spec:
      containers:
      - args:
        - controller
        - --metrics-bind-address=:8443
        - --leader-elect
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: S3_ENDPOINT
          valueFrom:
            secretKeyRef:
              key: COSI_S3_ENDPOINT
              name: libra-billing
        - name: S3_BUCKET
          valueFrom:
            secretKeyRef:
              key: COSI_S3_BUCKET_ID
              name: libra-billing
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              key: COSI_S3_ACCESS_KEY_ID
              name: libra-billing
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              key: COSI_S3_ACCESS_SECRET_KEY
              name: libra-billing
        image: ghcr.io/helmetica-framework/libra:v0.0.1
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports: []
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts: []
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: libra-controller-manager
      terminationGracePeriodSeconds: 10
      volumes: []
