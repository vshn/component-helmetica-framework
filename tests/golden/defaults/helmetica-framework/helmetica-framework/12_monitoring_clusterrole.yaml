apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    rbac.authorization.k8s.io/aggregate-to-admin: 'true'
  name: helmetica:monitoring-edit
rules:
  - apiGroups:
      - monitoring.coreos.com
    resources:
      - alertmanagerconfigs
      - servicemonitors
      - podmonitors
      - prometheusrules
    verbs:
      - '*'
