apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
  name: ampulla-crd-admin-role
rules:
- apiGroups:
  - backups.helmetica.io
  resources:
  - backuppolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - backups.helmetica.io
  resources:
  - backuppolicies/status
  verbs:
  - get
