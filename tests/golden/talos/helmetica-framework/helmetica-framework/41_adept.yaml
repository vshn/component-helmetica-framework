  name: adept-metrics-auth-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: adept-metrics-auth-role
subjects:
  - kind: ServiceAccount
    name: adept-controller-manager
    namespace: syn-helmetica-framework
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: adept
    control-plane: controller-manager
  name: adept-controller-manager-metrics-service
  namespace: syn-helmetica-framework
spec:
  ports:
    - name: https
      port: 8443
      protocol: TCP
      targetPort: 8443
  selector:
    app.kubernetes.io/name: adept
    control-plane: controller-manager
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: adept
    control-plane: controller-manager
  name: adept-webhook-service
  namespace: syn-helmetica-framework
spec:
  ports:
    - port: 443
      protocol: TCP
      targetPort: 9443
  selector:
    app.kubernetes.io/name: adept
    control-plane: controller-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: manager
    app.kubernetes.io/created-by: adept
    app.kubernetes.io/instance: controller-manager
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: deployment
    app.kubernetes.io/part-of: adept
    control-plane: controller-manager
  name: adept-controller-manager
  namespace: syn-helmetica-framework
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: adept
        control-plane: controller-manager
    spec:
      containers:
        - args:
            - controller
            - --metrics-bind-address=:8443
            - --leader-elect
            - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          image: ghcr.io/helmetica-framework/adept:v0.1.0-dev7
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          name: manager
          ports:
            - containerPort: 9443
              name: webhook-server
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /tmp/k8s-webhook-server/serving-certs
              name: webhook-certs
              readOnly: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: adept-controller-manager
      terminationGracePeriodSeconds: 10
      volumes:
        - name: webhook-certs
          secret:
            secretName: adept-webhook-server-cert
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: adept
  name: adept-serving-cert
  namespace: syn-helmetica-framework
spec:
  dnsNames:
    - adept-webhook-service.syn-helmetica-framework.svc
    - adept-webhook-service.syn-helmetica-framework.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: adept-selfsigned-issuer
  secretName: adept-webhook-server-cert
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: adept
  name: adept-selfsigned-issuer
  namespace: syn-helmetica-framework
spec:
  selfSigned: {}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: syn-helmetica-framework/adept-serving-cert
  name: adept-validating-webhook-configuration
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: adept-webhook-service
        namespace: syn-helmetica-framework
        path: /validate-adept-helmetica-io-v1-maintenancewindow
    failurePolicy: Fail
    name: vmaintenancewindow.adept.helmetica.io
    rules:
      - apiGroups:
          - adept.helmetica.io
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - maintenancewindows
    sideEffects: None
