      - adept.helmetica.io
    resources:
      - actions/status
      - definitions/status
      - maintenances/status
    verbs:
      - get
  - apiGroups:
      - adept.helmetica.io
    resources:
      - maintenancewindows
      - maintenances
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: adept-manager-role
