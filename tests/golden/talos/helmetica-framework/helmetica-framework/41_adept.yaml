      - list
      - patch
      - update
      - watch
  - apiGroups:
      - adept.helmetica.io
    resources:
      - actions/status
      - maintenances/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - adept.helmetica.io
    resources:
      - definitions
      - maintenances
      - maintenancewindows
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - batch
    resources:
      - cronjobs
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - delete
      - get
      - list
      - watch
  - apiGroups:
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
