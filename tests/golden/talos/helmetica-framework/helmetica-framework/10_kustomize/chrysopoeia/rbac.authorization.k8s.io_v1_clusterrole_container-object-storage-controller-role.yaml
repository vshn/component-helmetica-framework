apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    objectstorage.k8s.io/authors: Kubernetes Authors
    objectstorage.k8s.io/license: Apache V2
    objectstorage.k8s.io/support: https://github.com/kubernetes-sigs/container-object-storage-api
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: container-object-storage-interface-controller
    app.kubernetes.io/part-of: container-object-storage-interface
  name: container-object-storage-controller-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
- apiGroups:
  - objectstorage.k8s.io
  resources:
  - bucketaccessclasses
  - bucketclasses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - objectstorage.k8s.io
  resources:
  - bucketaccesses
  - bucketclaims
  verbs:
  - get
  - list
  - update
  - watch
- apiGroups:
  - objectstorage.k8s.io
  resources:
  - bucketaccesses/finalizers
  - bucketclaims/finalizers
  - buckets/finalizers
  verbs:
  - update
- apiGroups:
  - objectstorage.k8s.io
  resources:
  - bucketaccesses/status
  - bucketclaims/status
  - buckets/status
  verbs:
  - get
  - update
- apiGroups:
  - objectstorage.k8s.io
  resources:
  - buckets
  verbs:
  - create
  - delete
  - get
  - list
  - update
  - watch
