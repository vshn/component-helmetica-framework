apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: aludel-cloudscale
  name: aludel-cloudscale
  namespace: syn-helmetica-framework
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aludel-cloudscale
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aludel-cloudscale
    spec:
      containers:
      - args:
        - driver
        - --endpoint=unix:///var/lib/cosi/cosi.sock
        env:
        - name: CLOUDSCALE_API_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: aludel-cloudscale-credentials
        image: ghcr.io/helmetica-framework/aludel-cloudscale:pr-11
        imagePullPolicy: IfNotPresent
        name: aludel-cloudscale
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /var/lib/cosi
          name: cosi-socket
      - args:
        - --zap-log-level=debug
        env:
        - name: COSI_ENDPOINT
          value: unix:///var/lib/cosi/cosi.sock
        image: gcr.io/k8s-staging-sig-storage/objectstorage-sidecar:v20261019-controllerv0.2.0-rc1-354-g274540c
        name: objectstorage-provisioner-sidecar
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /var/lib/cosi
          name: cosi-socket
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: aludel-cloudscale
      volumes:
      - emptyDir: {}
        name: cosi-socket
