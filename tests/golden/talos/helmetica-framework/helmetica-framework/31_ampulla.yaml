apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: ampulla
    app.kubernetes.io/instance: controller-manager
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: serviceaccount
    app.kubernetes.io/part-of: ampulla
  name: ampulla-controller-manager
  namespace: syn-helmetica-framework
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: ampulla
    app.kubernetes.io/instance: leader-election-role
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: role
    app.kubernetes.io/part-of: ampulla
  name: ampulla-leader-election-role
  namespace: syn-helmetica-framework
rules:
  - apiGroups:
      - ''
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ''
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    rbac.authorization.k8s.io/aggregate-to-admin: 'true'
  name: ampulla-crd-admin-role
rules:
  - apiGroups:
      - ampulla.helmetica.io
    resources:
      - backuppolicies
      - backuptemplates
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ampulla.helmetica.io
    resources:
      - backuppolicies/status
      - backuptemplates/status
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ampulla-manager-role
rules:
  - apiGroups:
      - ''
    resources:
      - secrets
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ''
    resourceNames:
      - instance-admin
    resources:
      - serviceaccounts
    verbs:
      - impersonate
  - apiGroups:
      - ampulla.helmetica.io
    resources:
      - backuppolicies
      - backuptemplates
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ampulla.helmetica.io
    resources:
      - backuppolicies/status
      - backuptemplates/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - k8up.io
    resources:
      - schedules
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - objectstorage.k8s.io
    resources:
      - bucketaccesses
      - bucketclaims
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ampulla-metrics-auth-role
rules:
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
  - apiGroups:
      - authorization.k8s.io
    resources:
      - subjectaccessreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ampulla-metrics-reader
rules:
  - nonResourceURLs:
      - /metrics
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: ampulla
    app.kubernetes.io/instance: leader-election-rolebinding
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: rolebinding
    app.kubernetes.io/part-of: ampulla
  name: ampulla-leader-election-rolebinding
  namespace: syn-helmetica-framework
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ampulla-leader-election-role
subjects:
  - kind: ServiceAccount
    name: ampulla-controller-manager
    namespace: syn-helmetica-framework
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: ampulla
    app.kubernetes.io/instance: manager-rolebinding
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: clusterrolebinding
    app.kubernetes.io/part-of: ampulla
  name: ampulla-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ampulla-manager-role
subjects:
  - kind: ServiceAccount
    name: ampulla-controller-manager
    namespace: syn-helmetica-framework
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ampulla-metrics-auth-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ampulla-metrics-auth-role
subjects:
  - kind: ServiceAccount
    name: ampulla-controller-manager
    namespace: syn-helmetica-framework
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: ampulla
    control-plane: controller-manager
  name: ampulla-controller-manager-metrics-service
  namespace: syn-helmetica-framework
spec:
  ports:
    - name: https
      port: 8443
      protocol: TCP
      targetPort: 8443
  selector:
    app.kubernetes.io/name: ampulla
    control-plane: controller-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: manager
    app.kubernetes.io/created-by: ampulla
    app.kubernetes.io/instance: controller-manager
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: deployment
    app.kubernetes.io/part-of: ampulla
    control-plane: controller-manager
  name: ampulla-controller-manager
  namespace: syn-helmetica-framework
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: ampulla
        control-plane: controller-manager
    spec:
      containers:
        - args:
            - controller
            - --metrics-bind-address=:8443
            - --leader-elect
            - --metrics-cert-path=/tmp/k8s-metrics-server/metrics-certs
            - --default-bucket-class=cloudscale-lpg
            - --default-bucket-access-class=cloudscale-lpg
          image: ghcr.io/helmetica-framework/ampulla:v0.1.3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          name: manager
          ports: []
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /tmp/k8s-metrics-server/metrics-certs
              name: metrics-certs
              readOnly: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: ampulla-controller-manager
      terminationGracePeriodSeconds: 10
      volumes:
        - name: metrics-certs
          secret:
            items:
              - key: ca.crt
                path: ca.crt
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
            optional: false
            secretName: ampulla-metrics-server-cert
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: ampulla
  name: ampulla-metrics-certs
  namespace: syn-helmetica-framework
spec:
  dnsNames:
    - ampulla-controller-manager-metrics-service.syn-helmetica-framework.svc
    - ampulla-controller-manager-metrics-service.syn-helmetica-framework.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: ampulla-selfsigned-issuer
  secretName: ampulla-metrics-server-cert
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: ampulla
  name: ampulla-selfsigned-issuer
  namespace: syn-helmetica-framework
spec:
  selfSigned: {}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/component: metrics
    app.kubernetes.io/created-by: ampulla
    app.kubernetes.io/instance: controller-manager-metrics-monitor
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: servicemonitor
    app.kubernetes.io/part-of: ampulla
    control-plane: controller-manager
  name: ampulla-controller-manager-metrics-monitor
  namespace: syn-helmetica-framework
spec:
  endpoints:
    - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      path: /metrics
      port: https
      scheme: https
      tlsConfig:
        ca:
          secret:
            key: ca.crt
            name: ampulla-metrics-server-cert
        cert:
          secret:
            key: tls.crt
            name: ampulla-metrics-server-cert
        insecureSkipVerify: false
        keySecret:
          key: tls.key
          name: ampulla-metrics-server-cert
        serverName: ampulla-controller-manager-metrics-service.syn-helmetica-framework.svc
  selector:
    matchLabels:
      control-plane: controller-manager
