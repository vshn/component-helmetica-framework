apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: networkconfigs.sigillum.helmetica.io
spec:
  group: sigillum.helmetica.io
  names:
    kind: NetworkConfig
    listKind: NetworkConfigList
    plural: networkconfigs
    singular: networkconfig
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.allowAllNamespaces
          name: All Namespaces
          type: boolean
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .status.message
          name: Message
          type: string
      name: v1
      schema:
        openAPIV3Schema:
          description: NetworkConfig is sigillum's placeholder resource.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: NetworkConfigSpec describes who may reach the sealed namespace.
              properties:
                allowAllNamespaces:
                  description: |-
                    AllowAllNamespaces allows access from every namespace in the cluster,
                    effectively disabling the NetworkPolicy. It overrides AllowedNamespaces
                    and the claim namespace. Traffic from outside the cluster stays blocked.
                  type: boolean
                allowedNamespaces:
                  description: |-
                    AllowedNamespaces names the namespaces that may reach this one, on top of
                    the claim namespace the network config's own namespace is annotated with. Ignored
                    when AllowAllNamespaces is true.
                  items:
                    type: string
                  type: array
                expose:
                  description: |-
                    Expose asks for ways into this namespace from outside the cluster.

                    listType=map makes the API server reject duplicate names and makes
                    server-side apply merge per entry rather than replacing the whole list.
                  items:
                    description: |-
                      Exposure asks for one way into the sealed namespace from outside the cluster.

                      There is deliberately no port field. Sigillum allocates TCP ports itself and
                      reports them in status; letting a user pick one would reintroduce the clash
                      this controller exists to prevent.
                    properties:
                      backend:
                        description: Backend names the in-namespace service an exposure
                          points at.
                        properties:
                          port:
                            format: int32
                            maximum: 65535
                            minimum: 1
                            type: integer
                          service:
                            maxLength: 63
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                            type: string
                        required:
                          - port
                          - service
                        type: object
                      exposureClass:
                        description: Empty means the class named after this exposure's
                          protocol, lowercased.
                        type: string
                      name:
                        description: |-
                          Name identifies the exposure within this NetworkConfig. It becomes the listener
                          and route name, so it has to be a DNS label.
                        maxLength: 63
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                      protocol:
                        description: Protocol is what an exposure carries.
                        enum:
                          - HTTP
                          - HTTPS
                          - TCP
                        type: string
                      subdomain:
                        description: Empty means no subdomain label. HTTP and HTTPS
                          only.
                        type: string
                    required:
                      - backend
                      - name
                      - protocol
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - name
                  x-kubernetes-list-type: map
              type: object
            status:
              properties:
                exposures:
                  description: |-
                    Exposures reports one entry per Expose entry, in spec order. Every
                    requested exposure appears here from the first reconcile, even before its
                    class resolves: an empty list would read as "nothing was requested".
                  items:
                    description: ExposureStatus reports what an Exposure turned into.
                    properties:
                      address:
                        type: string
                      class:
                        type: string
                      conflictCount:
                        description: |-
                          ConflictCount stops a re-allocation loop when the gateway controller
                          keeps rejecting the port it was given.
                        format: int32
                        minimum: 0
                        type: integer
                      hostname:
                        type: string
                      message:
                        type: string
                      name:
                        maxLength: 63
                        minLength: 1
                        type: string
                      port:
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                      ready:
                        type: boolean
                      shard:
                        type: string
                      url:
                        type: string
                    required:
                      - name
                      - ready
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - name
                  x-kubernetes-list-type: map
                message:
                  description: Message explains a Failed phase.
                  type: string
                observedGeneration:
                  description: ObservedGeneration is the spec generation the phase
                    was computed from.
                  format: int64
                  type: integer
                phase:
                  type: string
              type: object
          type: object
      served: true
      storage: true
      subresources:
        status: {}
