apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    api-approved.kubernetes.io: unapproved, experimental v1alpha2 changes
    controller-gen.kubebuilder.io/version: v0.20.1
    objectstorage.k8s.io/authors: Kubernetes Authors
    objectstorage.k8s.io/license: Apache V2
    objectstorage.k8s.io/support: https://github.com/kubernetes-sigs/container-object-storage-api
  name: bucketaccessclasses.objectstorage.k8s.io
spec:
  group: objectstorage.k8s.io
  names:
    kind: BucketAccessClass
    listKind: BucketAccessClassList
    plural: bucketaccessclasses
    singular: bucketaccessclass
  scope: Cluster
  versions:
    - name: v1alpha2
      schema:
        openAPIV3Schema:
          description: BucketAccessClass is the Schema for the bucketaccessclasses
            API
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: spec defines the desired state of BucketAccessClass
              properties:
                authenticationType:
                  description: |-
                    authenticationType specifies which authentication mechanism is used bucket access.
                    See driver documentation to determine which values are supported.
                    Possible values:
                     - Key: The driver should generate a protocol-appropriate access key that clients can use to
                       authenticate to the backend object store.
                     - ServiceAccount: The driver should configure the system such that Pods using the given
                       ServiceAccount authenticate to the backend object store automatically.
                  enum:
                    - Key
                    - ServiceAccount
                  type: string
                disallowedBucketAccessModes:
                  description: |-
                    disallowedBucketAccessModes controls, per category, which Read/Write access modes are
                    disallowed. A BucketAccess using this class will not be allowed to request access to a
                    BucketClaim with any access mode listed here, per category.
                    This is particularly useful for administrators to restrict access to a statically-provisioned
                    bucket that is managed outside the BucketAccess Namespace or Kubernetes cluster.
                  minProperties: 1
                  properties:
                    bucketMetadata:
                      description: |-
                        bucketMetadata values disallow the corresponding Read/Write access to the metadata on the bucket itself.
                        Possible values: 'ReadWrite', 'ReadOnly', 'WriteOnly'.
                      items:
                        description: BucketAccessMode describes the Read/Write mode
                          an access should have for a bucket.
                        enum:
                          - ReadWrite
                          - ReadOnly
                          - WriteOnly
                        type: string
                      maxItems: 3
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: set
                    objectData:
                      description: |-
                        objectData values disallow the corresponding Read/Write access to the objects in a bucket.
                        Possible values: 'ReadWrite', 'ReadOnly', 'WriteOnly'.
                      items:
                        description: BucketAccessMode describes the Read/Write mode
                          an access should have for a bucket.
                        enum:
                          - ReadWrite
                          - ReadOnly
                          - WriteOnly
                        type: string
                      maxItems: 3
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: set
                    objectMetadata:
                      description: |-
                        objectMetadata values disallow the corresponding Read/Write access to the metadata on objects in a bucket.
                        Possible values: 'ReadWrite', 'ReadOnly', 'WriteOnly'.
                      items:
                        description: BucketAccessMode describes the Read/Write mode
                          an access should have for a bucket.
                        enum:
                          - ReadWrite
                          - ReadOnly
                          - WriteOnly
                        type: string
                      maxItems: 3
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: set
                  type: object
                driverName:
                  description: |-
                    driverName is the name of the driver that fulfills requests for this BucketAccessClass.
                    See driver documentation to determine the correct value to set.
                    Must be 63 characters or less, beginning and ending with an alphanumeric character
                    ([a-z0-9A-Z]) with dashes (-), dots (.), and alphanumerics between.
                  maxLength: 63
                  minLength: 1
                  pattern: ^[a-zA-Z0-9]([a-zA-Z0-9\-\.]{0,61}[a-zA-Z0-9])?$
                  type: string
                multiBucketAccess:
                  description: |-
                    multiBucketAccess specifies whether a BucketAccess using this class can reference multiple
                    BucketClaims. When omitted, this means no opinion, and COSI will choose a reasonable default,
                    which is subject to change over time.
                    Possible values:
                     - SingleBucket: (default) A BucketAccess may reference only a single BucketClaim.
                     - MultipleBuckets: A BucketAccess may reference multiple (1 or more) BucketClaims.
                  enum:
                    - SingleBucket
                    - MultipleBuckets
                  type: string
                parameters:
                  additionalProperties:
                    type: string
                  description: |-
                    parameters is an opaque map of driver-specific configuration items passed to the driver that
                    fulfills requests for this BucketAccessClass.
                    See driver documentation to determine supported parameters and their effects.
                    A maximum of 512 parameters are allowed.
                  maxProperties: 512
                  minProperties: 1
                  type: object
              required:
                - authenticationType
                - driverName
              type: object
              x-kubernetes-validations:
                - message: BucketAccessClass spec is immutable
                  rule: self == oldSelf
          required:
            - spec
          type: object
      served: true
      storage: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    api-approved.kubernetes.io: unapproved, experimental v1alpha2 changes
    controller-gen.kubebuilder.io/version: v0.20.1
    objectstorage.k8s.io/authors: Kubernetes Authors
    objectstorage.k8s.io/license: Apache V2
    objectstorage.k8s.io/support: https://github.com/kubernetes-sigs/container-object-storage-api
  name: bucketaccesses.objectstorage.k8s.io
spec:
  group: objectstorage.k8s.io
  names:
    kind: BucketAccess
    listKind: BucketAccessList
    plural: bucketaccesses
    singular: bucketaccess
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.readyToUse
          name: Ready
          type: boolean
        - jsonPath: .status.accountID
          name: Account ID
          type: string
        - jsonPath: .spec.bucketClaims[0].bucketClaimName
          name: Claim
          type: string
        - jsonPath: .spec.bucketClaims[0].accessSecretName
          name: Secret
          type: string
        - jsonPath: .status.error.message
          name: Error
          priority: 1
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha2
      schema:
        openAPIV3Schema:
          description: BucketAccess is the Schema for the bucketaccesses API
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: spec defines the desired state of BucketAccess
              properties:
                bucketAccessClassName:
                  description: bucketAccessClassName selects the BucketAccessClass
                    for provisioning the access.
                  maxLength: 253
                  minLength: 1
                  type: string
                  x-kubernetes-validations:
                    - message: bucketAccessClassName is immutable
                      rule: self == oldSelf
                bucketClaims:
                  description: |-
                    bucketClaims is a list of BucketClaims the provisioned access must have permissions for,
                    along with per-BucketClaim access parameters and system output definitions.
                    At least one BucketClaim must be referenced.
                    A maximum of 128 BucketClaims may be referenced.
                    Multiple references to the same BucketClaim are not permitted.
                  items:
                    description: |-
                      BucketClaimAccess selects a BucketClaim for access, defines access parameters for the
                      corresponding bucket, and specifies where user-consumable bucket information and access
                      credentials for the accessed bucket will be stored.
                    properties:
                      accessModes:
                        description: |-
                          accessModes represents Read/Write access modes that this BucketAccess should
                          have for the BucketClaim, separated into the following categories:
                          - objectData - the objects themselves (their content)
                          - objectMetadata - metadata on objects (e.g. tags)
                          - bucketMetadata - metadata on the bucket itself (e.g. tags)
                          For each category, an empty access mode request means the user does not require
                          the permission and does not care if the corresponding access is allowed or not.
                          At least one access mode is required.
                        minProperties: 1
                        properties:
                          bucketMetadata:
                            description: |-
                              bucketMetadata controls Read/Write access to the metadata on the bucket itself.
                              Unspecified means any access may be provisioned, including no access.
                              Possible values: 'ReadWrite', 'ReadOnly', 'WriteOnly'.
                            enum:
                              - ReadWrite
                              - ReadOnly
                              - WriteOnly
                            type: string
                          objectData:
                            description: |-
                              objectData controls Read/Write access to the objects in a bucket.
                              Unspecified means any access may be provisioned, including no access.
                              Possible values: 'ReadWrite', 'ReadOnly', 'WriteOnly'.
                            enum:
                              - ReadWrite
                              - ReadOnly
                              - WriteOnly
                            type: string
                          objectMetadata:
                            description: |-
                              objectMetadata controls Read/Write access to the metadata on objects in a bucket.
                              Unspecified means any access may be provisioned, including no access.
                              Possible values: 'ReadWrite', 'ReadOnly', 'WriteOnly'.
                            enum:
                              - ReadWrite
                              - ReadOnly
                              - WriteOnly
                            type: string
                        type: object
                      accessSecretName:
                        description: |-
                          accessSecretName is the name of a Kubernetes Secret that COSI should create and populate with
                          bucket info and access credentials for the bucket.
                          The Secret is created in the same Namespace as the BucketAccess and is deleted when the
                          BucketAccess is deleted and deprovisioned.
                          The Secret name must be unique across all bucketClaimRefs for all BucketAccesses in the same
                          Namespace.
                          Must be a valid Kubernetes resource name: at most 253 characters, consisting only of
                          lower-case alphanumeric characters, hyphens, and periods, starting and ending with an
                          alphanumeric character.
                        maxLength: 253
                        minLength: 1
                        type: string
                        x-kubernetes-validations:
                          - message: name must be a valid resource name
                            rule: '!format.dns1123Subdomain().validate(self).hasValue()'
                      bucketClaimName:
                        description: |-
                          bucketClaimName is the name of a BucketClaim the access should have permissions for.
                          The BucketClaim must be in the same Namespace as the BucketAccess.
                          Must be a valid Kubernetes resource name: at most 253 characters, consisting only of
                          lower-case alphanumeric characters, hyphens, and periods, starting and ending with an
                          alphanumeric character.
                        maxLength: 253
                        minLength: 1
                        type: string
                        x-kubernetes-validations:
                          - message: name must be a valid resource name
                            rule: '!format.dns1123Subdomain().validate(self).hasValue()'
                    required:
                      - accessModes
                      - accessSecretName
                      - bucketClaimName
                    type: object
                  maxItems: 128
                  minItems: 1
                  type: array
                  x-kubernetes-list-map-keys:
                    - bucketClaimName
                  x-kubernetes-list-type: map
                  x-kubernetes-validations:
                    - message: bucketClaims list is immutable
                      rule: self == oldSelf
                protocol:
                  description: |-
                    protocol is the object storage protocol that the provisioned access must use.
                    Access can only be granted for BucketClaims that support the requested protocol.
                    Each BucketClaim status reports which protocols are supported for the BucketClaim's bucket.
                    Possible values: 'S3', 'Azure', 'GCS'.
                  enum:
                    - S3
                    - Azure
                    - GCS
                  type: string
                  x-kubernetes-validations:
                    - message: protocol is immutable
                      rule: self == oldSelf
                serviceAccountName:
                  description: |-
                    serviceAccountName is the name of the Kubernetes ServiceAccount that user application Pods
                    intend to use for access to referenced BucketClaims.
                    Required when the BucketAccessClass is configured to use ServiceAccount authentication type.
                    Ignored for all other authentication types.
                    It is recommended to specify this for all BucketAccesses to improve portability.
                  maxLength: 253
                  minLength: 1
                  type: string
                  x-kubernetes-validations:
                    - message: serviceAccountName is immutable
                      rule: self == oldSelf
              required:
                - bucketAccessClassName
                - bucketClaims
                - protocol
              type: object
              x-kubernetes-validations:
                - message: serviceAccountName cannot be added or removed after creation
                  rule: has(oldSelf.serviceAccountName) == has(self.serviceAccountName)
            status:
              description: status defines the observed state of BucketAccess
              properties:
                accessedBuckets:
                  description: |-
                    accessedBuckets is a list of Buckets the provisioned access must have permissions for, along
                    with per-Bucket access options. This field is populated by the COSI Controller based on the
                    referenced BucketClaims in the spec.
                  items:
                    description: AccessedBucket identifies a Bucket and correlates
                      it to a BucketClaimAccess from the spec.
                    properties:
                      bucketClaimName:
                        description: |-
                          bucketClaimName must match a BucketClaimAccess's BucketClaimName from the spec.
                          Must be a valid Kubernetes resource name: at most 253 characters, consisting only of
                          lower-case alphanumeric characters, hyphens, and periods, starting and ending with an
                          alphanumeric character.
                        maxLength: 253
                        minLength: 1
                        type: string
                        x-kubernetes-validations:
                          - message: name must be a valid resource name
                            rule: '!format.dns1123Subdomain().validate(self).hasValue()'
                      bucketID:
                        description: |-
                          bucketID is the unique identifier for the backend bucket known to the driver for which
                          this access should have permissions.
                          Must be at most 2048 characters and consist only of alphanumeric characters ([a-z0-9A-Z]),
                          dashes (-), dots (.), underscores (_), and forward slash (/).
                        maxLength: 2048
                        minLength: 1
                        pattern: ^[a-zA-Z0-9/._-]+$
                        type: string
                      bucketName:
                        description: |-
                          bucketName is the name of a Bucket the access should have permissions for.
                          Must be a valid Kubernetes resource name: at most 253 characters, consisting only of
                          lower-case alphanumeric characters, hyphens, and periods, starting and ending with an
                          alphanumeric character.
                        maxLength: 253
                        minLength: 1
                        type: string
                        x-kubernetes-validations:
                          - message: name must be a valid resource name
                            rule: '!format.dns1123Subdomain().validate(self).hasValue()'
                    required:
                      - bucketClaimName
                      - bucketID
                      - bucketName
                    type: object
                  maxItems: 128
                  minItems: 1
                  type: array
                  x-kubernetes-list-map-keys:
                    - bucketName
                  x-kubernetes-list-type: map
                  x-kubernetes-validations:
                    - message: accessedBuckets is immutable once set
                      rule: self == oldSelf
                accountID:
                  description: |-
                    accountID is the unique identifier for the backend access known to the driver.
                    This field is populated by the COSI Sidecar once access has been successfully granted.
                    Must be at most 2048 characters and consist only of alphanumeric characters ([a-z0-9A-Z]),
                    dashes (-), dots (.), underscores (_), and forward slash (/).
                  maxLength: 2048
                  minLength: 1
                  pattern: ^[a-zA-Z0-9/._-]+$
                  type: string
                  x-kubernetes-validations:
                    - message: accountId is immutable once set
                      rule: self == oldSelf
                authenticationType:
                  description: |-
                    authenticationType holds a copy of the BucketAccessClass authentication type from the time of
                    BucketAccess provisioning. This field is populated by the COSI Controller.
                    Possible values:
                     - Key: clients may use a protocol-appropriate access key to authenticate to the backend object store.
                     - ServiceAccount: Pods using the ServiceAccount given in spec.serviceAccountName may authenticate to the backend object store automatically.
                  enum:
                    - Key
                    - ServiceAccount
                  type: string
                  x-kubernetes-validations:
                    - message: authenticationType is immutable once set
                      rule: self == oldSelf
                driverName:
                  description: |-
                    driverName holds a copy of the BucketAccessClass driver name from the time of BucketAccess
                    provisioning. This field is populated by the COSI Controller.
                    Must be 63 characters or less, beginning and ending with an alphanumeric character
                    ([a-z0-9A-Z]) with dashes (-), dots (.), and alphanumerics between.
                  maxLength: 63
                  minLength: 1
                  pattern: ^[a-zA-Z0-9]([a-zA-Z0-9\-\.]{0,61}[a-zA-Z0-9])?$
                  type: string
                  x-kubernetes-validations:
                    - message: driverName is immutable once set
                      rule: self == oldSelf
                error:
                  description: |-
                    error holds the most recent error message, with a timestamp.
                    This is cleared when provisioning is successful.
                  minProperties: 0
                  properties:
                    message:
                      description: |-
                        message is a string detailing the encountered error.
                        NOTE: message will be logged, and it should not contain sensitive information.
                        Must not exceed 1.5MB.
                      maxLength: 1572864
                      minLength: 0
                      type: string
                    time:
                      description: time is the timestamp when the error was encountered.
                      format: date-time
                      type: string
                  type: object
                parameters:
                  additionalProperties:
                    type: string
                  description: |-
                    parameters holds a copy of the BucketAccessClass parameters from the time of BucketAccess
                    provisioning. This field is populated by the COSI Controller.
                  maxProperties: 512
                  minProperties: 1
                  type: object
                  x-kubernetes-validations:
                    - message: accessedBuckets is immutable once set
                      rule: self == oldSelf
                readyToUse:
                  description: readyToUse indicates that the BucketAccess is ready
                    for consumption by workloads.
                  type: boolean
              required:
                - readyToUse
              type: object
              x-kubernetes-validations:
                - message: accountID cannot be removed once set
                  rule: '!has(oldSelf.accountID) || has(self.accountID)'
                - message: accessedBuckets cannot be removed once set
                  rule: '!has(oldSelf.accessedBuckets) || has(self.accessedBuckets)'
                - message: driverName cannot be removed once set
                  rule: '!has(oldSelf.driverName) || has(self.driverName)'
                - message: authenticationType cannot be removed once set
                  rule: '!has(oldSelf.authenticationType) || has(self.authenticationType)'
                - message: parameters cannot be removed once set
                  rule: '!has(oldSelf.parameters) || has(self.parameters)'
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
