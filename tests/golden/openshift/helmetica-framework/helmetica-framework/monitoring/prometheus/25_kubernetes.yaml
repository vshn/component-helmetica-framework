apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kubelet
  namespace: syn-helmetica-framework-monitoring
spec:
  attachMetadata:
    node: true
  endpoints:
    - honorLabels: true
      honorTimestamps: true
      interval: 30s
      metricRelabelings:
        - action: keep
          regex: container_memory_working_set_bytes
          sourceLabels:
            - __name__
        - action: keep
          regex: (hel|)x-.+
          sourceLabels:
            - namespace
      path: /metrics/cadvisor
      port: https-metrics
      relabelings:
        - action: replace
          sourceLabels:
            - __metrics_path__
          targetLabel: metrics_path
      scheme: https
      scrapeTimeout: 30s
      trackTimestampsStaleness: true
    - honorLabels: true
      interval: 30s
      metricRelabelings:
        - action: keep
          regex: (kubelet_volume_stats_.+)
          sourceLabels:
            - __name__
        - action: keep
          regex: (hel|)x-.+
          sourceLabels:
            - namespace
      port: https-metrics
      relabelings:
        - action: replace
          sourceLabels:
            - __metrics_path__
          targetLabel: metrics_path
      scheme: https
      scrapeTimeout: 30s
  jobLabel: k8s-app
  namespaceSelector:
    matchNames:
      - kube-system
  scrapeClass: tls-client-certificate-auth
  selector:
    matchLabels:
      k8s-app: kubelet
  serviceDiscoveryRole: EndpointSlice
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: copy-metrics-secret
  namespace: syn-helmetica-framework-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: copy-metrics-secret
  namespace: syn-helmetica-framework-monitoring
rules:
  - apiGroups:
      - ''
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: copy-metrics-secret
  namespace: syn-helmetica-framework-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: copy-metrics-secret
subjects:
  - kind: ServiceAccount
    name: copy-metrics-secret
    namespace: syn-helmetica-framework-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: syn-helmetica-framework-monitoring:copy-metrics-secret
  namespace: openshift-monitoring
rules:
  - apiGroups:
      - ''
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: syn-helmetica-framework-monitoring:copy-metrics-secret
  namespace: openshift-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: syn-helmetica-framework-monitoring:copy-metrics-secret
subjects:
  - kind: ServiceAccount
    name: copy-metrics-secret
    namespace: syn-helmetica-framework-monitoring
---
apiVersion: espejote.io/v1alpha1
kind: ManagedResource
metadata:
  annotations:
    syn.tools/description: TODO
  name: copy-metrics-secret
  namespace: syn-helmetica-framework-monitoring
spec:
  applyOptions:
    force: true
  context:
    - name: source_secret
      resource:
        apiVersion: v1
        kind: Secret
        name: metrics-client-certs
        namespace: openshift-monitoring
  serviceAccountRef:
    name: copy-metrics-secret
  template: |
    local esp = import 'espejote.libsonnet';

    local source = esp.context().source_secret;
    assert
      std.length(source) == 1
      : 'Expected source context to have exactly 1 element';

    local sourceSecret = source[0];

    {
      apiVersion: sourceSecret.apiVersion,
      kind: sourceSecret.kind,
      metadata: {
        name: 'ocp-metrics-client-certs',
        labels: {
          'app.kubernetes.io/managed-by': 'espejote',
          'app.kubernetes.io/part-of': 'helmetica',
          'app.kubernetes.io/component': 'helmetica-framework',
        },
      },
      type: sourceSecret.type,
      data: sourceSecret.data,
    }
  triggers:
    - name: watch-source-tls-secret
      watchContextResource:
        name: source_secret
    - name: watch-target-tls-secret
      watchResource:
        apiVersion: v1
        kind: Secret
        name: ocp-metrics-client-certs
