apiVersion: objectstorage.k8s.io/v1alpha2
kind: BucketClaim
metadata:
  name: libra-billing
  namespace: syn-helmetica-framework
spec:
  bucketClassName: ''
  protocols:
    - S3
---
apiVersion: objectstorage.k8s.io/v1alpha2
kind: BucketAccess
metadata:
  name: libra-billing
  namespace: syn-helmetica-framework
spec:
  bucketAccessClassName: ''
  bucketClaims:
    - accessMode: ReadWrite
      accessSecretName: libra-billing
      bucketClaimName: libra-billing
  protocol: S3
