apiVersion: v1
kind: ServiceAccount
metadata:
  name: aludel-cloudscale
  namespace: syn-helmetica-framework
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aludel-cloudscale-leaderelection
  namespace: syn-helmetica-framework
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - watch
      - list
      - delete
      - update
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aludel-cloudscale-sidecar
rules:
  - apiGroups:
      - objectstorage.k8s.io
    resources:
      - buckets
      - bucketaccesses
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - objectstorage.k8s.io
    resources:
      - buckets/status
      - bucketaccesses/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - objectstorage.k8s.io
    resources:
      - buckets/finalizers
      - bucketaccesses/finalizers
    verbs:
      - update
  - apiGroups:
      - ''
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ''
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aludel-cloudscale-leaderelection
  namespace: syn-helmetica-framework
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aludel-cloudscale-leaderelection
subjects:
  - kind: ServiceAccount
    name: aludel-cloudscale
    namespace: syn-helmetica-framework
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aludel-cloudscale-sidecar
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aludel-cloudscale-sidecar
subjects:
  - kind: ServiceAccount
    name: aludel-cloudscale
    namespace: syn-helmetica-framework
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: aludel-cloudscale
  name: aludel-cloudscale
  namespace: syn-helmetica-framework
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aludel-cloudscale
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aludel-cloudscale
    spec:
      containers:
        - args:
            - driver
            - --endpoint=unix:///var/lib/cosi/cosi.sock
          env:
            - name: CLOUDSCALE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  key: token
                  name: aludel-cloudscale-credentials
          image: ghcr.io/helmetica-framework/aludel-cloudscale:v0.0.1-dev2
          imagePullPolicy: IfNotPresent
          name: aludel-cloudscale
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /var/lib/cosi
              name: cosi-socket
        - args:
            - --zap-log-level=debug
          env:
            - name: COSI_ENDPOINT
              value: unix:///var/lib/cosi/cosi.sock
          image: gcr.io/k8s-staging-sig-storage/objectstorage-sidecar:v20261019-controllerv0.2.0-rc1-354-g274540c
          name: objectstorage-provisioner-sidecar
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /var/lib/cosi
              name: cosi-socket
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: aludel-cloudscale
      volumes:
        - emptyDir: {}
          name: cosi-socket
