parameters:
  kapitan:

    compile:
      - input_paths:
          - ${_base_directory}/component/app.jsonnet
        input_type: jsonnet
        output_path: .
      - input_paths:
          - ${_base_directory}/component/main.jsonnet
          - ${_base_directory}/component/framework.jsonnet
        input_type: jsonnet
        output_path: helmetica-framework/
      - input_paths:
          - ${_base_directory}/component/services.jsonnet
        input_type: jsonnet
        output_path: helmetica-framework/
      - input_paths:
          - ${_base_directory}/component/monitoring-stack.jsonnet
        input_type: jsonnet
        output_path: helmetica-framework/monitoring/prometheus
