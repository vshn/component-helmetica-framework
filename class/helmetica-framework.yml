parameters:
  kapitan:
    dependencies:
      - type: https
        source: https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/refs/tags/${helmetica_framework:monitoring_stack:version}/bundle.yaml
        output_path: dependencies/helmetica-framework/manifests/prometheus-operator/${helmetica_framework:monitoring_stack:version}/bundle/bundle.yaml

    compile:
      - input_paths:
          - ${_base_directory}/component/app.jsonnet
        input_type: jsonnet
        output_path: .
      - input_paths:
          - ${_base_directory}/component/main.jsonnet
        input_type: jsonnet
        output_path: helmetica-framework/
      - input_paths:
          - ${_base_directory}/component/prometheus-operator.jsonnet
        input_type: jsonnet
        output_path: helmetica-framework/
      - input_paths:
          - ${_base_directory}/component/kustomize.jsonnet
        input_type: jsonnet
        output_path: ${_base_directory}/manifests/kustomize
      - input_paths:
          - ${_kustomize_wrapper}
        input_type: external
        output_path: .
        env_vars:
          INPUT_DIR: ${_base_directory}/manifests/kustomize
        args:
          - \${compiled_target_dir}/${_instance}/10_kustomize/chrysopoeia

