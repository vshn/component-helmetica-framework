parameters:
  helmetica_framework:
    =_metadata:
      multi_tenant: false
    namespace: syn-helmetica-framework
    namespaceMetadata: {}

    images:
      chrysopoeia:
        registry: ghcr.io
        repository: helmetica-framework/chrysopoeia
        tag: v0.1.0-dev25
      custos:
        registry: ghcr.io
        repository: helmetica-framework/custos
        tag: v0.0.2
      ampulla:
        registry: ghcr.io
        repository: helmetica-framework/ampulla
        tag: v0.0.2
      adept:
        registry: ghcr.io
        repository: helmetica-framework/adept
        tag: v0.1.0-dev5
      sigillum:
        registry: ghcr.io
        repository: helmetica-framework/sigillum
        tag: v0.1.0
      flux-source-controller:
        registry: ghcr.io
        repository: fluxcd/source-controller
        tag: v1.9.0
      flux-image-reflector-controller:
        registry: ghcr.io
        repository: fluxcd/image-reflector-controller
        tag: v1.2.0
      flux-helm-controller:
        registry: ghcr.io
        repository: fluxcd/helm-controller
        tag: v1.6.3
      alertmanager:
        registry: quay.io
        repository: prometheus/alertmanager
        tag: v0.31.1
      prometheus:
        registry: quay.io
        repository: prometheus/prometheus
        tag: v3.15.0
      prometheus-operator:
        registry: quay.io
        repository: prometheus-operator/prometheus-operator
        tag: v0.87.0
      prometheus-config-reloader:
        registry: quay.io
        repository: prometheus-operator/prometheus-config-reloader
        tag: v0.87.0
      aludel-cloudscale:
        registry: ghcr.io
        repository: helmetica-framework/aludel-cloudscale
        tag: pr-11

    secrets: {}

    flux:
      deployed: true
      kustomize:
        manifest: https://github.com/helmetica-framework/chrysopoeia/config/flux
        version: ${helmetica_framework:images:chrysopoeia:tag}
        input:
          namespace: ${helmetica_framework:namespace}

    chrysopoeia_crds:
      deployed: true
      kustomize:
        manifest: https://github.com/helmetica-framework/chrysopoeia/config/crd
        version: ${helmetica_framework:images:chrysopoeia:tag}
        input: {}

    chrysopoeia_controller:
      deployed: true
      kustomize:
        manifest: https://github.com/helmetica-framework/chrysopoeia/config/default
        # version: ${helmetica_framework:images:chrysopoeia:tag}
        version: main
        input:
          namespace: ${helmetica_framework:namespace}

    chrysopoeia_proxy:
      deployed: true
      kustomize:
        manifest: https://github.com/helmetica-framework/chrysopoeia/config/proxy
        # version: ${helmetica_framework:images:chrysopoeia:tag}
        version: main
        input:
          namespace: ${helmetica_framework:namespace}

    custos_crds:
      deployed: true
      kustomize:
        manifest: https://github.com/helmetica-framework/custos/config/crd
        version: ${helmetica_framework:images:custos:tag}
        input: {}

    custos_controller:
      deployed: true
      kustomize:
        manifest: https://github.com/helmetica-framework/custos/config/default
        # version: ${helmetica_framework:images:custos:tag}
        version: ${helmetica_framework:images:custos:tag}
        input:
          namespace: ${helmetica_framework:namespace}

    ampulla_crds:
      deployed: true
      kustomize:
        manifest: https://github.com/helmetica-framework/ampulla/config/crd
        version: ${helmetica_framework:images:ampulla:tag}
        input: {}

    ampulla_controller:
      deployed: true
      kustomize:
        manifest: https://github.com/helmetica-framework/ampulla/config/default
        # version: ${helmetica_framework:images:ampulla:tag}
        version: main
        input:
          namespace: ${helmetica_framework:namespace}
      # BucketClass and BucketAccessClass used for policies that don't name
      # their own. The upstream base sets none. null falls back to the
      # aludel_cloudscale defaults if the driver is deployed, and leaves the
      # flag unset otherwise.
      default_bucket_class: null
      default_bucket_access_class: null

    adept_crds:
      deployed: true
      kustomize:
        manifest: https://github.com/helmetica-framework/adept/config/crd
        version: ${helmetica_framework:images:adept:tag}
        input: {}

    adept_controller:
      deployed: true
      kustomize:
        manifest: https://github.com/helmetica-framework/adept/config/default
        # version: ${helmetica_framework:images:adept:tag}
        version: main
        input:
          namespace: ${helmetica_framework:namespace}

    sigillum_crds:
      deployed: true
      kustomize:
        manifest: https://github.com/helmetica-framework/sigillum/config/crd
        version: ${helmetica_framework:images:sigillum:tag}
        input: {}

    sigillum_controller:
      deployed: true
      kustomize:
        manifest: https://github.com/helmetica-framework/sigillum/config/default
        version: ${helmetica_framework:images:sigillum:tag}
        input:
          namespace: ${helmetica_framework:namespace}

    cosi:
      deployed: ${helmetica_framework:aludel_cloudscale:deployed}
      kustomize:
        manifest: https://github.com/helmetica-framework/aludel-cloudscale/config/crd
        # The COSI CRDs, controller and sidecar images are pinned by aludel-cloudscale
        # itself and must come from the same COSI commit, so they are not overridden here.
        # version: ${helmetica_framework:images:aludel-cloudscale:tag}
        version: feat/cosi-v1alpha2
        input:
          namespace: ${helmetica_framework:namespace}

    # COSI driver for cloudscale.ch object storage
    aludel_cloudscale:
      deployed: false
      api_token: ?{vaultkv:${cluster:tenant}/${cluster:name}/helmetica-framework/cloudscale/token}
      driver_name: cloudscale-objectstorage.helmetica.io
      bucket_classes:
        cloudscale-lpg:
          spec:
            deletionPolicy: Retain
            parameters:
              region: lpg
        cloudscale-rma:
          spec:
            deletionPolicy: Retain
            parameters:
              region: rma
      bucket_access_classes:
        cloudscale-lpg: {}
        cloudscale-rma: {}
      default_bucket_class: cloudscale-lpg
      default_bucket_access_class: cloudscale-lpg
      kustomize:
        manifest: https://github.com/helmetica-framework/aludel-cloudscale/config/manager
        version: feat/cosi-v1alpha2
        input:
          namespace: ${helmetica_framework:namespace}

    monitoring_stack:
      enabled: false
      namespace: ${helmetica_framework:namespace}-monitoring
      namespaceMetadata:
        labels:
          helmetica.io/monitoring: system
      # Observed on APPUiO Lab OCP 4.21.32 / Wed 23 Sep 2026 10:14:15 CEST
      version: v0.87.0
      # Valid values: [talos, openshift4, kind]
      platform: ""

      secrets: {}

      alertmanager:
        replicas: 2
        resources:
          limits:
            cpu: 100m
            memory: 100Mi
          requests:
            cpu: 4m
            memory: 100Mi
        retention: 120h
        global_config: {}

      prometheus:
        retention: 8d
        resources:
          limits:
            memory: '2Gi'
          requests:
            cpu: '100m'
            memory: '2Gi'
