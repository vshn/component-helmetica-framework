parameters:
  helmetica_framework:
    =_metadata:
      multi_tenant: true
    namespace: syn-helmetica-framework
    namespaceMetadata: {}
    jsonnetfile_parameters:
      alembic_version: v0.1.2

    images: {}

    chrysopoeia:
      admission: espejote

    ampulla:
      default_bucket_class: null
      default_bucket_access_class: null

    libra:
      bucket:
        name: libra-billing
        bucketClassName: ""
        bucketAccessClassName: ""

    secrets: {}

    maintenance_windows:
      default:
        spec:
          default: true
          daysOfWeek: [tuesday]
          time: "22:00"
          duration: 6h
          timeZone: Europe/Zurich

    # COSI driver for cloudscale.ch object storage
    aludel_cloudscale:
      deployed: false
      api_token: ?{vaultkv:${cluster:tenant}/${cluster:name}/helmetica-framework/cloudscale/token}
      driver_name: cloudscale-objectstorage.helmetica.io
      bucket_classes:
        cloudscale-lpg:
          spec:
            deletionPolicy: Retain
            parameters:
              region: lpg
        cloudscale-rma:
          spec:
            deletionPolicy: Retain
            parameters:
              region: rma
      bucket_access_classes:
        cloudscale-lpg: {}
        cloudscale-rma: {}
      default_bucket_class: cloudscale-lpg
      default_bucket_access_class: cloudscale-lpg

    monitoring_stack:
      enabled: false
      namespace: ${helmetica_framework:namespace}-monitoring
      namespaceMetadata:
        labels:
          helmetica.io/monitoring: system
      # Valid values: [talos, openshift4, kind]
      platform: ""

      secrets: {}

      alertmanager:
        replicas: 2
        resources:
          limits:
            cpu: 100m
            memory: 100Mi
          requests:
            cpu: 4m
            memory: 100Mi
        retention: 120h
        global_config: {}

      prometheus:
        retention: 8d
        resources:
          limits:
            memory: '2Gi'
          requests:
            cpu: '100m'
            memory: '2Gi'

    services: {}

    dependency_groups: {}

    claims: {}
